name: Đưa gallery lên GitHub Pages

# Đăng thư mục gallery/ (trang xem trước sinh bởi sinh-gallery.py).
# Gallery được sinh lại ngay trước khi đăng, nên tập mới tự xuất hiện — không phải
# nhớ chạy sinh-gallery.py rồi commit.
# Nếu Pages chưa bật (Settings → Pages → Source: GitHub Actions) thì job tự bỏ qua
# thay vì báo đỏ, để lần đẩy nào cũng xanh.
on:
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - "sinh-gallery.py"
      - "kich-ban.py"
      - ".github/workflows/pages.yml"
  # dựng xong video mới thì cập nhật gallery theo
  workflow_run:
    workflows: ["Dựng video đồ hoạ (HTML → Chromium → ffmpeg)"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  dang:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.dang.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Sinh lại gallery từ kịch bản
        run: python3 sinh-gallery.py

      - name: Kiểm tra Pages đã bật chưa
        id: bat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${{ github.repository }}/pages" >/dev/null 2>&1; then
            echo "co=1" >> "$GITHUB_OUTPUT"
          else
            echo "co=0" >> "$GITHUB_OUTPUT"
            echo "::notice::Pages chưa bật. Vào Settings → Pages → Source: GitHub Actions, rồi chạy lại workflow này."
          fi

      - name: Chuẩn bị Pages
        if: steps.bat.outputs.co == '1'
        uses: actions/configure-pages@v5

      - name: Đóng gói thư mục gallery
        if: steps.bat.outputs.co == '1'
        uses: actions/upload-pages-artifact@v3
        with:
          path: gallery

      - name: Đăng lên Pages
        id: dang
        if: steps.bat.outputs.co == '1'
        uses: actions/deploy-pages@v4
