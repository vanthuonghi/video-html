name: Dựng video đồ hoạ (HTML → Chromium → ffmpeg)

on:
  workflow_dispatch:
    inputs:
      tap:
        description: "Tập cần dựng, cách nhau dấu cách. Bỏ trống = dựng tất cả (chạy tay). Lần đẩy lên chỉ dựng tập có trang HTML đổi."
        required: false
        default: ""
      fps:
        description: "Số khung hình mỗi giây (24 là đủ mượt cho đồ hoạ chậm)"
        required: false
        default: "24"
      giong:
        description: "Giọng đọc edge-tts"
        required: false
        default: "vi-VN-NamMinhNeural"
      workers:
        description: "Số tiến trình chụp khung mỗi tập (máy CI 4 nhân; để trống = 4)"
        required: false
        default: ""
      ti_le:
        description: "Ghi 1 để dựng thêm bản 1:1 và 16:9 của tập mẫu 02 (tự chạy khi tập 02 đổi)"
        required: false
        default: ""
  push:
    branches: [main]
    paths:
      - "do-hoa/**"
      - "*.py"
      - "*.sh"
      - "requirements.txt"

permissions:
  contents: write

# Không huỷ lần dựng đang chạy: mỗi tập là một máy riêng, chạy song song được.
concurrency:
  group: dung-${{ github.ref }}
  cancel-in-progress: false

jobs:
  chuan-bi:
    runs-on: ubuntu-latest
    outputs:
      tap: ${{ steps.ls.outputs.tap }}
      co: ${{ steps.ls.outputs.co }}
    steps:
      - uses: actions/checkout@v5
        with:
          # cần lịch sử để so trang HTML với commit trước
          fetch-depth: 0
      - name: Chọn tập cần dựng (chỉ tập có trang đổi)
        id: ls
        env:
          IN: ${{ github.event.inputs.tap }}
          TRUOC: ${{ github.event.before }}
        run: python3 chon-tap.py
      - name: Tạo release chứa video (nếu chưa có)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view moi-nhat >/dev/null 2>&1 || \
            gh release create moi-nhat --title "Video mới nhất" \
              --notes "Mỗi lần dựng, tệp cùng tên được thay mới tại đây. URL không đổi."

  dung:
    needs: chuan-bi
    # không có tập nào đổi thì bỏ qua hẳn: video cũ đã xong, không dựng lại
    if: needs.chuan-bi.outputs.co == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # mỗi tập là một máy riêng: dựng nhiều tập cùng lúc thì nhanh hơn là xếp hàng
      max-parallel: 12
      matrix:
        tap: ${{ fromJSON(needs.chuan-bi.outputs.tap) }}
    name: ${{ matrix.tap }}
    steps:
      - uses: actions/checkout@v5

      - name: Cài ffmpeg, phông chữ và thư viện Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core fonts-dejavu-core
          python3 -m pip install --quiet -r requirements.txt \
            || python3 -m pip install --quiet --break-system-packages -r requirements.txt
          python3 -c "import websocket, edge_tts, qrcode; print('thư viện ok')"

      - name: Tìm hoặc cài trình duyệt
        run: |
          set -e
          CH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -z "$CH" ]; then
            echo "Máy chủ không có sẵn, tải đúng bản Chrome for Testing đã ghim"
            curl -sL -o /tmp/chrome.zip \
              https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/linux64/chrome-linux64.zip
            unzip -q /tmp/chrome.zip -d /opt
            CH=/opt/chrome-linux64/chrome
          fi
          echo "CHROME_PATH=$CH" >> "$GITHUB_ENV"
          "$CH" --version

      - name: Sinh nhạc nền và mã QR
        run: |
          python3 sinh-nhac.py
          python3 sinh-qr.py

      - name: Giữ lại lời đọc giữa các lần dựng
        uses: actions/cache@v4
        with:
          path: .thu-nghiem/giong
          key: giong-${{ matrix.tap }}-${{ hashFiles('dung-tap-do-hoa.py', 'kich-ban.py') }}-${{ github.event.inputs.giong || 'vi-VN-NamMinhNeural' }}
          restore-keys: giong-${{ matrix.tap }}-

      - name: Sinh giọng đọc bằng edge-tts (kèm mốc từng từ)
        run: |
          python3 sinh-giong-edge.py "${{ matrix.tap }}" \
            --giong "${{ github.event.inputs.giong || 'vi-VN-NamMinhNeural' }}"

      - name: Kiểm tra kịch bản và dựng trang HTML (có phụ đề theo mốc từ)
        run: |
          python3 kiem-tra-kich-ban.py
          python3 dung-tap-do-hoa.py

      - name: Chụp khung hình và mã hoá
        # khung JPEG chuyển thẳng vào ffmpeg qua ống, mỗi tiến trình tự mã hoá đoạn của
        # mình (mã hoá chạy song song với việc chụp) rồi ghép lại: không ghi 1008 tệp
        # trung gian và mất thêm ~30s mã hoá sau khi chụp xong
        env:
          FPS: ${{ github.event.inputs.fps || '24' }}
        run: |
          python3 -m http.server 8899 >/dev/null 2>&1 &
          sleep 2
          mkdir -p video-do-hoa
          python3 chup-nhanh.py \
            "http://127.0.0.1:8899/do-hoa/${{ matrix.tap }}.html" \
            ".thu-nghiem/frames-${{ matrix.tap }}" \
            --workers "${{ github.event.inputs.workers || '4' }}" --fps "$FPS" --port 9400 --clean \
            --encode-out "video-do-hoa/${{ matrix.tap }}.mp4"

      - name: Ghép lời đọc và nhạc nền
        run: python3 ghep-tieng-tap.py "${{ matrix.tap }}"

      - name: Sinh phụ đề .srt từ lời đọc
        run: python3 sinh-phu-de.py "${{ matrix.tap }}"

      - name: Sinh ảnh bìa và metadata.json
        run: |
          python3 -m http.server 8899 >/dev/null 2>&1 &
          sleep 2
          python3 sinh-poster.py "${{ matrix.tap }}"
          python3 sinh-metadata.py "${{ matrix.tap }}"

      - name: Soát bố cục — chặn chữ tràn vùng an toàn trước khi đăng
        run: |
          python3 -m http.server 8899 >/dev/null 2>&1 &
          sleep 2
          python3 soat-do-hoa.py "${{ matrix.tap }}" --step 2.5 --fail

      - name: Kiểm tra đầu ra (thời lượng, khung, tiếng không câm)
        run: python3 kiem-tra.py "${{ matrix.tap }}"

      - name: Đăng lên release — URL công khai cố định
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload moi-nhat "video-do-hoa/${{ matrix.tap }}_co-tieng.mp4" \
            "video-do-hoa/${{ matrix.tap }}.srt" \
            "video-do-hoa/${{ matrix.tap }}_poster.png" \
            "video-do-hoa/${{ matrix.tap }}_thumb.png" \
            "video-do-hoa/${{ matrix.tap }}.json" --clobber
          sha256sum "video-do-hoa/${{ matrix.tap }}_co-tieng.mp4"

      - name: Lưu bản dựng vào mục tải về của lần chạy
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.tap }}
          path: |
            video-do-hoa/*_co-tieng.mp4
            video-do-hoa/*.srt
            video-do-hoa/*_poster.png
            video-do-hoa/*_thumb.png
            video-do-hoa/*.json
          retention-days: 14

  # Bản 1:1 và 16:9 của tập mẫu: cùng kịch bản, cùng lời đọc, chỉ khác khung.
  # Chỉ chạy khi tập mẫu đổi (hoặc chọn tay) để không cộng thêm thời gian vào lần dựng thường.
  ti-le-khac:
    needs: chuan-bi
    if: |
      needs.chuan-bi.outputs.co == '1' && (
        github.event.inputs.ti_le == '1' ||
        contains(needs.chuan-bi.outputs.tap, '02_noi-tham-trong-dau'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        size: ["1080x1080", "1920x1080"]
    name: 02 · ${{ matrix.size }}
    steps:
      - uses: actions/checkout@v5

      - name: Cài ffmpeg và thư viện Python
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python3 -m pip install --quiet -r requirements.txt \
            || python3 -m pip install --quiet --break-system-packages -r requirements.txt

      - name: Tìm hoặc cài trình duyệt
        run: |
          set -e
          CH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -z "$CH" ]; then
            curl -sL -o /tmp/chrome.zip \
              https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/linux64/chrome-linux64.zip
            unzip -q /tmp/chrome.zip -d /opt
            CH=/opt/chrome-linux64/chrome
          fi
          echo "CHROME_PATH=$CH" >> "$GITHUB_ENV"

      - name: Sinh nhạc nền và mã QR
        run: |
          python3 sinh-nhac.py
          python3 sinh-qr.py

      - name: Giữ lại lời đọc giữa các lần dựng
        uses: actions/cache@v4
        with:
          path: .thu-nghiem/giong
          key: giong-02_noi-tham-trong-dau-${{ hashFiles('dung-tap-do-hoa.py', 'kich-ban.py') }}-${{ github.event.inputs.giong || 'vi-VN-NamMinhNeural' }}
          restore-keys: giong-02_noi-tham-trong-dau-

      - name: Sinh giọng đọc của tập mẫu
        run: |
          python3 sinh-giong-edge.py 02_noi-tham-trong-dau \
            --giong "${{ github.event.inputs.giong || 'vi-VN-NamMinhNeural' }}"

      - name: Dựng trọn một tập ở khung ${{ matrix.size }}
        run: |
          python3 -m http.server 8899 >/dev/null 2>&1 &
          sleep 2
          python3 dung-ti-le-khac.py 02_noi-tham-trong-dau --size "${{ matrix.size }}" \
            --workers "${{ github.event.inputs.workers || '4' }}" --fps "${{ github.event.inputs.fps || '24' }}"

      - name: Soát bố cục khung ${{ matrix.size }}
        run: |
          python3 -m http.server 8899 >/dev/null 2>&1 &
          sleep 2
          python3 soat-do-hoa.py 02_noi-tham-trong-dau --size "${{ matrix.size }}" --step 2.5 --fail

      - name: Kiểm tra đầu ra (thời lượng, khung, tiếng không câm)
        run: python3 kiem-tra.py 02_noi-tham-trong-dau --size "${{ matrix.size }}"

      - name: Đăng lên release — URL công khai cố định
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload moi-nhat \
            "video-do-hoa/02_noi-tham-trong-dau_${{ matrix.size }}_co-tieng.mp4" --clobber
          sha256sum "video-do-hoa/02_noi-tham-trong-dau_${{ matrix.size }}_co-tieng.mp4"

      - name: Lưu bản dựng vào mục tải về của lần chạy
        uses: actions/upload-artifact@v5
        with:
          name: 02-${{ matrix.size }}
          path: video-do-hoa/02_noi-tham-trong-dau_${{ matrix.size }}_co-tieng.mp4
          retention-days: 14

  soat-bo-cuc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Cài thư viện Python cho trình duyệt
        run: |
          python3 -m pip install --quiet -r requirements.txt \
            || python3 -m pip install --quiet --break-system-packages -r requirements.txt
          python3 -c "import websocket; print('thư viện ok')"

      - name: Tìm hoặc cài trình duyệt
        run: |
          set -e
          CH=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)
          if [ -z "$CH" ]; then
            curl -sL -o /tmp/chrome.zip \
              https://storage.googleapis.com/chrome-for-testing-public/156.0.8078.80/linux64/chrome-linux64.zip
            unzip -q /tmp/chrome.zip -d /opt
            CH=/opt/chrome-linux64/chrome
          fi
          echo "CHROME_PATH=$CH" >> "$GITHUB_ENV"

      - name: Dựng HTML và soát bố cục mọi tập
        run: |
          python3 kiem-tra-kich-ban.py
          python3 sinh-qr.py
          python3 dung-tap-do-hoa.py
          python3 -m http.server 8899 >/dev/null 2>&1 &
          sleep 2
          python3 soat-do-hoa.py --step 2.5 --fail

      - name: Sinh lại và soát mọi trang tỉ lệ khác đã commit
        # lấy từ repo chứ không gắn cứng một tập: thêm trang 1:1/16:9 cho tập khác là
        # nó tự được soát, và quên sinh lại sau khi đổi thẻ kết thúc là bước sau báo đỏ
        run: |
          for f in $(git ls-files 'do-hoa/*_*x*.html'); do
            ten=$(basename "$f")
            tap=${ten%%_[0-9]*x[0-9]*.html}
            size=$(echo "$ten" | grep -oE '[0-9]+x[0-9]+' | tail -1)
            echo "→ $tap · $size"
            python3 dung-tap-do-hoa.py --tap "$tap" --size "$size" >/dev/null
            python3 soat-do-hoa.py "$tap" --size "$size" --step 2.5 --fail
          done

      - name: Trang HTML đã commit phải khớp bản sinh lại
        # Bắt đúng lỗi đã xảy ra: trang cũ nằm lại trong repo thì lần đẩy nào bước
        # chọn tập cũng thấy "đổi" và dựng lại một video không có gì mới.
        run: |
          if ! git diff --quiet -- 'do-hoa/*.html'; then
            git --no-pager diff --stat -- 'do-hoa/*.html'
            # in phần lệch: đọc được ngay dòng nào khác thay vì phải đoán
            git --no-pager diff -U1 -- 'do-hoa/*.html' | head -60
            echo "::error::do-hoa/*.html đã commit đang lệch với generator; chạy python3 dung-tap-do-hoa.py rồi commit."
            exit 1
          fi
          echo "do-hoa/*.html khớp với generator"

      - name: Kiểm hợp đồng render (cùng mốc t phải ra cùng khung)
        run: python3 kiem-tra-hop-dong.py 02_noi-tham-trong-dau 08_truong-nhin

